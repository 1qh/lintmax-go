version: 2
project_name: lintmax-go
before:
  hooks:
    - go mod tidy
builds:
  - env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: 1qh
    name: lintmax-go
