version: 2
project_name: lintmax-go
before:
  hooks:
    - go mod tidy
builds:
  - env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: lintmax-go
    repository:
      owner: 1qh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/1qh/lintmax-go
    description: Maximum-strictness Go quality gate. Always-latest, never stale.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lintmax-go"]
          end
release:
  github:
    owner: 1qh
    name: lintmax-go
