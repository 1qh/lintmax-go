name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - name: wipe workspace (leftover-file leakage between runs on shared runner)
        run: rm -rf "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"* 2>/dev/null || true
      - uses: actions/checkout@v7
      - name: shellcheck every shell script in the repo
        run: shellcheck install.sh .github/scripts/*.sh
      - name: cancel sibling jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
  dogfood:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - name: wipe workspace (leftover-file leakage between runs on shared runner)
        run: rm -rf "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"* 2>/dev/null || true
      - uses: actions/checkout@v7
      - name: install self at HEAD (always-latest source of truth — current checkout = current main)
        run: go install .
      - name: "dogfood — check (every linter + nilaway + deadcode + govulncheck + osv-scanner + capslock + staleness all always-on)"
        run: '"$HOME/go/bin/lintmax-go" check'
      - name: cancel sibling jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
  prune-history:
    needs: [shell, dogfood]
    runs-on: ${{ vars.RUNNER_LABEL }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: wipe workspace (sparse-checkout leakage between jobs on shared runner)
        run: rm -rf "${GITHUB_WORKSPACE:?}/".[!.]* "${GITHUB_WORKSPACE:?}/"* 2>/dev/null || true
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: prune all prior CI runs (single-present-run discipline)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN_ID: ${{ github.run_id }}
        run: .github/scripts/prune-ci-runs.sh
