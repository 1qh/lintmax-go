name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck install.sh + any future shell scripts
        run: shellcheck install.sh
      - name: cancel sibling jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
  dogfood:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v6
      - name: install self at HEAD (always-latest source of truth — current checkout = current main)
        run: go install .
      - name: "dogfood — check --deep (max strictness: every linter + nilaway + govulncheck + osv-scanner)"
        run: $HOME/go/bin/lintmax-go check --deep
      - name: cancel sibling jobs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
