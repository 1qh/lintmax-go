name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck install.sh + any future shell scripts
        run: shellcheck install.sh
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: cache go bin (every linter tool lintmax-go installs)
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/tools/tools.go') }}
          restore-keys: |
            gobin-${{ runner.os }}-${{ runner.arch }}-
      - name: cache lintmax-go staleness (24h GH/go-list disk cache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/lintmax-go
          key: lintmaxcache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_number }}
          restore-keys: |
            lintmaxcache-${{ runner.os }}-${{ runner.arch }}-
      - name: cache go-build (build + test + golangci-lint analysis)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', '!**/*_test.go') }}
          restore-keys: |
            gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            gocaches-${{ runner.os }}-${{ runner.arch }}-
      - name: install self (so the gate runs the compiled binary, not 'go run' recompile)
        run: go install .
      - name: "dogfood — check --deep (max strictness: every linter + nilaway + govulncheck + osv-scanner)"
        run: $HOME/go/bin/lintmax-go check --deep
