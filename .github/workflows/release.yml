name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: cache go-build (cross-build per goreleaser target)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', '!**/*_test.go') }}
          restore-keys: |
            gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            gocaches-${{ runner.os }}-${{ runner.arch }}-
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
