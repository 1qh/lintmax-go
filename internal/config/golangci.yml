# lintmax-go embedded config — maximum strictness, PARITY with lintmax (TypeScript).
#
# Parity model (mirrors lintmax exactly):
#   1. enable EVERYTHING (default: all) — like biome all-categories-error +
#      oxlint all-7-categories-error + eslint all + typescript-eslint all.
#   2. everything is an error, never a warning.
#   3. internal checks of each linter pushed to maximum.
#   4. unused suppressions are errors (nolintlint == reportUnusedDisableDirectives).
#
# DISABLE NOTHING up front. Every exception must be EARNED by a concrete,
# documented reason discovered on real code — never anticipated. The disable
# list starts empty on purpose.
version: "2"

linters:
  default: all
  disable:
    # EARNED disables — each forced by the comment-strip + compact philosophy
    # (parity with lintmax comments.ts + compact.ts), never anticipated.
    - wsl        # demands blank lines between statements; fights compact
    - wsl_v5     # successor of wsl; same conflict
    - nlreturn   # demands a blank line before return; fights compact
    - depguard          # empty allowlist denies ALL imports; non-functional without per-project config
    - gochecknoglobals  # map-literal data can't be const; parity: lintmax allows module-level decls
    - mnd               # parity: no-magic-numbers off (same as revive add-constant)
    - gomodguard        # deprecated v2.12.0; superseded by gomodguard_v2 (in default:all)
    - testpackage       # no lintmax/eslint equivalent; forces black-box-only, can't test unexported entrypoints
    - exhaustruct       # opt-out is //exhaustruct:optional comments, which comment-strip deletes — incompatible with the comment-strip philosophy
    - tagliatelle       # systematically fights structs mirroring external JSON (vendor/API response shapes dictate tag case); no lintmax equivalent
    - varnamelen        # parity: lintmax disables id-length; fights idiomatic Go short names (i, r, w, c, k, v, ok); most-disabled linter in the ecosystem
    - goconst           # flags repeated API/path-segment strings (list/get/create across many tools); they are the surface, not magic constants; no lintmax equivalent
    - funlen            # parity: lintmax disables max-lines-per-function; line-count limit (complexity still bounded by cyclomatic, which stays on)
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      # EARNED parity (no-console off): documented-never-fail writers.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*strings.Builder).Write
    govet:
      enable-all: true
      # fieldalignment reorders fields for memory packing; fights readable JSON-DTO
      # field order, no lintmax/eslint equivalent (JS has no memory layout).
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000  # EARNED: comment-strip removes package comments; rule demands them
    gocritic:
      enable-all: true
      # unnamedResult demands named multi-returns; conflicts with nonamedreturns (bans them). Keep unnamed.
      disabled-checks:
        - unnamedResult
    gosec:
      severity: low
      confidence: low
    exhaustive:
      default-signifies-exhaustive: false
    nakedret:
      max-func-lines: 0
    revive:
      enable-all-rules: true
      rules:
        # EARNED: golines (formatter) owns line width at 123; revive default 80 fights it.
        - name: line-length-limit
          arguments: [123]
        # EARNED: comment-strip deletes all doc comments, so requiring them
        # (parity with lintmax jsdoc-require: off) is a guaranteed conflict.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # EARNED parity (no-magic-numbers off): flags 0/1 literals — unworkable.
        - name: add-constant
          disabled: true
        # EARNED parity (max-lines-per-function off): line-count limit; complexity stays via cyclomatic.
        - name: function-length
          disabled: true
        # EARNED: no lintmax/eslint equivalent (eslint uses cyclomatic, not cognitive).
        - name: cognitive-complexity
          disabled: true
        # EARNED: no lintmax/eslint equivalent; bool mode params are idiomatic Go CLI orchestration.
        - name: flag-parameter
          disabled: true
        # EARNED: arbitrary cap (default 5), absurd for a types/wire file; no lintmax equivalent.
        - name: max-public-structs
          disabled: true
        # EARNED parity (no-console off): documented-never-fail writers.
        - name: unhandled-error
          arguments:
            - "fmt.Print.*"
            - "fmt.Fprint.*"
            - "strings.Builder.Write.*"
  exclusions:
    # turn OFF golangci's silent default suppressions — report everything.
    generated: lax
    presets: []
    rules: []

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      extra-rules: true
    golines:
      max-len: 123

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Parity with lintmax warnToError: every finding is an error, never a warning.
severity:
  default: error

run:
  tests: true
  modules-download-mode: readonly
