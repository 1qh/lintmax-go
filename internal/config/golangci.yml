# lintmax-go embedded config — maximum strictness, PARITY with lintmax (TypeScript).
#
# Parity model (mirrors lintmax exactly):
#   1. enable EVERYTHING (default: all) — like biome all-categories-error +
#      oxlint all-7-categories-error + eslint all + typescript-eslint all.
#   2. everything is an error, never a warning.
#   3. internal checks of each linter pushed to maximum.
#   4. unused suppressions are errors (nolintlint == reportUnusedDisableDirectives).
#
# DISABLE NOTHING up front. Every exception must be EARNED by a concrete,
# documented reason discovered on real code — never anticipated. The disable
# list starts empty on purpose.
version: "2"

linters:
  default: all
  disable:
    # Disables are EARNED — each rule below has a documented structural conflict with our locked
    # policy. Audit pass 2026-05-26 re-enabled tagliatelle/varnamelen/goconst/funlen/depguard/
    # gochecknoglobals/testpackage as legitimate strictness; the remaining 5 stay off below.
    - wsl # whitespace around blocks; direct conflict with compact-style policy
    - wsl_v5 # successor of wsl; same conflict
    - nlreturn # blank-before-return; direct conflict with compact-style policy
    - gomodguard # deprecated v2.12.0; superseded by gomodguard_v2 (active in default:all)
    # exhaustruct_v5 (v5.0.3) PANICS rather than reporting: `makeslice: cap out of range` inside
    # its own internal/structure.(*Struct).skippedNamed, which aborts the whole goanalysis
    # metalinter and takes every other rule's verdict with it — a crashing linter is strictly
    # worse than an absent one, because the run says nothing at all. The DEPRECATED exhaustruct
    # enforces the identical rule at the identical first-party scope and does not crash, so the
    # bar does not move while this is off. TRIGGER TO REVISIT: a v5 release past 5.0.3, at which
    # point re-enable and read whether the panic is gone before trusting a clean run.
    - exhaustruct_v5 # upstream panic in 5.0.3; the deprecated exhaustruct covers the same rule
  settings:
    goconst:
      ignore-calls: false
      min-occurrences: 2
    exhaustruct:
      # include is filled at config-generation time from the consuming project's go.mod module
      # path (^<module>/) so all-fields-set is enforced on FIRST-PARTY structs only — full
      # strictness on the code that matters, no flood on stdlib/third-party T{}. configless:
      # lintmax derives it from go.mod, no consumer file. unreadable go.mod -> ON unscoped.
      include: []
    exhaustruct_v5:
      # The rule was renamed upstream and the OLD name is deprecated, so both are enabled under
      # `default: all` and BOTH need the first-party scope. The v5 rule also RENAMED the field:
      # `include` became `enforce-patterns`, and an unknown key is dropped in SILENCE rather than
      # refused — measured, a consuming repo went from a clean gate to 604 findings, every one a
      # stdlib literal such as `&http.Client{Timeout: t}`, while a config carrying `include` here
      # looked correct. enforce-patterns is filled from go.mod exactly as include is above.
      enforce-patterns: []
    modernize:
      # `newexpr` rewrites a pointer helper into Go 1.27's new(value), and the gate's OWN capability
      # scanner cannot read that construct: capslock's SSA builder panics and then reports nothing at
      # all for the whole package. Two tools in one gate disagreeing is an oscillation the consumer
      # cannot win, so the rewrite is off until the scanner catches up.
      disable:
        - newexpr
    mnd:
      ignored-numbers: ["0", "1"]
    errcheck:
      check-type-assertions: true
      check-blank: true
      # EARNED parity (no-console off): documented-never-fail writers.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*strings.Builder).Write
    govet:
      enable-all: true
      # fieldalignment reorders fields for memory packing; fights readable JSON-DTO
      # field order, no lintmax/eslint equivalent (JS has no memory layout).
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000 # EARNED: comment-strip removes package comments; rule demands them
    lll:
      # EARNED: align lll with golines/revive width (123); default 120 conflicts with the formatter.
      line-length: 123
    gocritic:
      enable-all: true
      # unnamedResult demands named multi-returns; conflicts with nonamedreturns (bans them). Keep unnamed.
      disabled-checks:
        - unnamedResult
    gosec:
      severity: low
      confidence: low
    varnamelen:
      min-name-length: 1
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - ok
        - err
        - id
        - tx
        - db
        - fn
        - kv
        - ch
        - mu
        - rw
        - wg
        - cc
        - cs
        - bp
        - rb
        - re
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    depguard:
      rules:
        main:
          # depguard prefix-matches Pkg, so a bare `log` deny also bans `log/slog`.
          # Unstructured `log` usage is enforced via forbidigo on call sites (below);
          # third-party packages with no namespace collision stay here.
          deny:
            - pkg: github.com/pkg/errors
              desc: archived; use stdlib errors.Join + fmt.Errorf %w
            - pkg: github.com/sirupsen/logrus
              desc: maintenance-mode; ~50x slower than slog
            - pkg: io/ioutil
              desc: deprecated; use io + os package equivalents
    forbidigo:
      # Generic Go discipline only — bans that apply to any Go project. Project/ecosystem bans
      # (in-house import paths, a project's env/clock single-source conventions) are not generic
      # and stay in the consuming project's own enforcement layer, never in lintmax.
      # depguard cannot reach log.* (prefix-match on `log` vs `log/slog`); forbidigo targets usage.
      forbid:
        - pattern: '^log\.(Print|Println|Printf|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Default|SetFlags|SetOutput|SetPrefix|New|Logger)$'
          msg: use log/slog (the unstructured log package is banned)
        - pattern: '^fmt\.Print(|f|ln)$'
          msg: use slog or stderr writer; bare fmt.Print writes to stdout and pollutes agent-first NDJSON
        - pattern: '^context\.Background$'
          msg: "tests must use t.Context() (forbidigo: ban context.Background in _test.go)"
      exclude-godoc-examples: true
      analyze-types: true
    exhaustive:
      default-signifies-exhaustive: false
    nakedret:
      max-func-lines: 0
    revive:
      enable-all-rules: true
      rules:
        # EARNED: golines (formatter) owns line width at 123; revive default 80 fights it.
        - name: line-length-limit
          arguments: [123]
        # EARNED: comment-strip deletes all doc comments, so requiring them
        # (parity with lintmax jsdoc-require: off) is a guaranteed conflict.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # EARNED parity (no-magic-numbers off): flags 0/1 literals — unworkable.
        - name: add-constant
          disabled: true
        # EARNED parity (max-lines-per-function off): line-count limit; complexity stays via cyclomatic.
        - name: function-length
          disabled: true
        # EARNED: no lintmax/eslint equivalent (eslint uses cyclomatic, not cognitive).
        - name: cognitive-complexity
          disabled: true
        # EARNED: no lintmax/eslint equivalent; bool mode params are idiomatic Go CLI orchestration.
        - name: flag-parameter
          disabled: true
        # EARNED: conflicts with nonamedreturns (wants named, the other bans); keep unnamed-return regime.
        - name: confusing-results
          disabled: true
        # EARNED: arbitrary cap (default 5), absurd for a types/wire file; no lintmax equivalent.
        - name: max-public-structs
          disabled: true
        # EARNED parity (no-console off): documented-never-fail writers.
        - name: unhandled-error
          arguments:
            - "fmt.Print.*"
            - "fmt.Fprint.*"
            - "strings.Builder.Write.*"
  exclusions:
    # turn OFF golangci's silent default suppressions — report everything.
    generated: lax
    presets: []
    # codegen output (sqlc / templ): committed, regenerated, never hand-edited — deterministic
    # path exclusion so findings never depend on golangci's generated-file-filter cache state.
    paths:
      - "(^|/)node_modules/"
      - '\.sql\.go$'
      - '_templ\.go$'
    rules:
      # EARNED: CLI binaries (cli/, cmd/) ARE the bootstrap layer; fmt.Print to stdout + os.Getenv
      # for raw flags ARE the legitimate exception. Strictness applies to library code only.
      - path: "(^|/)(cli|cmd)/"
        linters:
          - forbidigo
      # EARNED: fuzz files MUST be in the same package as the target (Go fuzz convention) — testpackage rule is wrong for fuzz.
      - path: '_fuzz_test\.go$'
        linters:
          - testpackage

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gofumpt:
      # The `extra` block rather than the deprecated `extra-rules`: the FORMATTER ignores the old key
      # while the LINTER still enforces it, so `fix` reports ok and `check` reports the same finding
      # for ever — measured as two gofumpt findings that survived every fix run.
      extra:
        group-params: true
    golines:
      max-len: 123

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Parity with lintmax warnToError: every finding is an error, never a warning.
severity:
  default: error

run:
  tests: true
  modules-download-mode: readonly
