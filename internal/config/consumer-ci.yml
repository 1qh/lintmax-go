name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lintmax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: cache go bin (lintmax-go + every linter tool it installs)
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ github.run_number }}
          restore-keys: |
            gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-
            gobin-${{ runner.os }}-${{ runner.arch }}-
      - name: cache lintmax-go staleness (24h GH/go-list disk cache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/lintmax-go
          key: lintmaxcache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_number }}
          restore-keys: |
            lintmaxcache-${{ runner.os }}-${{ runner.arch }}-
      - name: cache go-build + golangci-lint analysis
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', '!**/*_test.go') }}
          restore-keys: |
            gocaches-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            gocaches-${{ runner.os }}-${{ runner.arch }}-
      - run: go install github.com/1qh/lintmax-go@latest
      - run: lintmax-go check --deep
