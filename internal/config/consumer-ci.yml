name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lintmax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/1qh/lintmax-go@latest
      - run: lintmax-go check --deep
